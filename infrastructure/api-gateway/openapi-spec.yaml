swagger: '2.0'
info:
  title: Star Wars API Gateway
  description: API Gateway para o Case Técnico SWAPI
  version: 0.1.0
schemes:
  - https
produces:
  - application/json

paths:
  /:
    get:
      summary: Root endpoint
      operationId: getRoot
      x-google-backend:
        address: FUNCTION_URL_PLACEHOLDER/
      responses:
        '200':
          description: OK

  /health:
    get:
      summary: Health check para CI/CD
      operationId: healthCheck
      tags:
        - System
      x-google-backend:
        address: FUNCTION_URL_PLACEHOLDER/health
      responses:
        '200':
          description: OK

  /people:
    get:
      summary: Lista de personagens
      operationId: getPeopleList
      parameters:
        - name: page
          in: query
          required: false
          type: integer
          default: 1
      x-google-backend:
        address: FUNCTION_URL_PLACEHOLDER/people
      responses:
        '200':
          description: OK

  /people/{people_id}:
    get:
      summary: Busca por personagem
      operationId: getPerson
      parameters:
        - name: people_id
          in: path
          required: true
          type: integer
      x-google-backend:
        address: FUNCTION_URL_PLACEHOLDER/people/{people_id}
      responses:
        '200':
          description: OK

  /films:
