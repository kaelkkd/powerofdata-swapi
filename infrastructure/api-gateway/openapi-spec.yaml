      summary: Busca por filme
      operationId: getFilm
      parameters:
        - name: film_id
          in: path
          required: true
          type: integer
      x-google-backend:
        address: FUNCTION_URL_PLACEHOLDER/films/{film_id}
      responses:
        '200':
          description: OK

  /planets:
